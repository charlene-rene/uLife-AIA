var VITALITY_EXTRA = 0.05;
// AHC รับส่วนลด Vitality เฉพาะเมื่อ >= 5 หน่วย
var VITALITY_DISC_COND = { ahc: function(r){ return (r.units||0) >= 5; } };
var VITALITY_RIDERS = ["ci","ciplus","citopup","ahc","hh","hbextra"];

function calcVitalityDiscount(riderTotals, activeRiders) {
  var vActive = riderTotals.filter(function(r) {
    return VITALITY_RIDERS.indexOf(r.id) >= 0 && r.annual > 0;
  });
  var vCount = 0;
  vActive.forEach(function(r) {
    vCount += (r.id === "ci") ? 2 : 1;
  });
  var hasExtra = vCount >= 3;
  var items = vActive.map(function(r) {
    var cond = VITALITY_DISC_COND[r.id];
    var eligible = hasExtra && (!cond || cond(r));
    var discAmt = eligible ? Math.round(r.annual * VITALITY_EXTRA) : 0;
    return { id:r.id, annual:r.annual, baseDisc:0, extraDisc:eligible?VITALITY_EXTRA:0, totalDisc:eligible?VITALITY_EXTRA:0, discAmt:discAmt };
  });
  var totalDiscAmt = items.reduce(function(s,x){return s+x.discAmt;},0);
  return { items:items, hasExtra:hasExtra, vCount:vCount, totalDiscAmt:totalDiscAmt };
}

function useCovInput(initial) {
  var def = initial || 1000000;
  var [str, setStr] = useState(def.toLocaleString("th-TH"));
  var [val, setVal] = useState(def);
  var ref = useRef(null);
  useEffect(function() {
    var n = parseInt(str.replace(/,/g,""), 10);
    setVal(!isNaN(n) && n > 0 ? n : 0);
  }, [str]);
  function onChange(e) { setStr(e.target.value.replace(/[^0-9]/g,"")); }
  function onBlur() {
    var n = parseInt(str.replace(/,/g,""), 10);
    if(!isNaN(n)) setStr(n.toLocaleString("th-TH"));
  }
  function onFocus() {
    setStr(String(val));
    setTimeout(function() { if(ref.current) ref.current.select(); }, 30);
  }
  function setQuick(v) { setStr(v.toLocaleString("th-TH")); }
  return {str:str, val:val, ref:ref, onChange:onChange, onBlur:onBlur, onFocus:onFocus, setQuick:setQuick};

                );

            )
          )

}

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
} catch(e) {

    '<div style="padding:20px;color:#c00;font-family:sans-serif;font-size:12px"><b>Error:</b><br>'+e.message+'<br><br><pre style="font-size:10px;white-space:pre-wrap">'+(e.stack||'')+'</pre></div>';
}
</script>
