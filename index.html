  <script>
    // Pre-check CDN loaded
    window.addEventListener('load', function() {
      if(!window.React || !window.ReactDOM || !window.Babel) {
        document.getElementById('loading').innerHTML = '<div style="color:#c00;padding:20px;font-size:13px">โหลด React library ไม่ได้ กรุณาตรวจสอบ internet</div>';
        return;
      }
      try {
        var scriptEl = document.getElementById('app-code');
        var transformed = Babel.transform(scriptEl.textContent, {
          presets: ['react']
        }).code;
        var fn = new Function('React','ReactDOM', transformed + '\nreturn App;');
        var AppComponent = fn(React, ReactDOM);
        var root = document.getElementById('root');
        root.innerHTML = '';
        ReactDOM.createRoot(root).render(React.createElement(AppComponent));
      } catch(e) {
        document.getElementById('loading').style.display = 'none';
        var errEl = document.getElementById('err');
        errEl.style.display = 'block';
        errEl.textContent = 'Error: ' + e.message;
        console.error(e);
      }
    });

  var key = Math.min(Math.max(age, 0), 65);
  var row = rateTable[key];

  if(cov >= 1000000) return 1.50;

// ===================== HELPERS =====================
function fmt(n) { return Math.round(n).toLocaleString("th-TH"); }
var PINK = "#E8175D";
var GRAY = "#f5f5f5";
var DARK = "#1a1a2e";
var MUTED= "#999";

function findPlan(arr, id) {
  for(var i=0;i<arr.length;i++) { if(arr[i].id===id) return arr[i]; }
  return null;
}

function useCovInput(initial) {
  var def = initial || 1000000;
  var [str, setStr] = useState(def.toLocaleString("th-TH"));
  var [val, setVal] = useState(def);
  var ref = useRef(null);
  useEffect(function() {
    var n = parseInt(str.replace(/,/g,""), 10);
    setVal(!isNaN(n) && n > 0 ? n : 0);
  }, [str]);
  function onChange(e) { setStr(e.target.value.replace(/[^0-9]/g,"")); }
  function onBlur() {
    var n = parseInt(str.replace(/,/g,""), 10);
    if(!isNaN(n)) setStr(n.toLocaleString("th-TH"));
  }
  function onFocus() {
    setStr(String(val));
    setTimeout(function() { if(ref.current) ref.current.select(); }, 30);
  }
  function setQuick(v) { setStr(v.toLocaleString("th-TH")); }
  return {str:str, val:val, ref:ref, onChange:onChange, onBlur:onBlur, onFocus:onFocus, setQuick:setQuick};
}

function MoneyInput(props) {
  var hook = props.hook, color = props.color, valid = props.valid !== false, placeholder = props.placeholder || "0";
  return (
    <div style={{position:"relative"}}>
      <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",
        fontSize:14,color:"#aaa",pointerEvents:"none"}}>฿</span>
      <input ref={hook.ref} type="text" inputMode="numeric"
        value={hook.str} onChange={hook.onChange} onBlur={hook.onBlur} onFocus={hook.onFocus}
        placeholder={placeholder}
        style={{width:"100%",padding:"11px 12px 11px 28px",fontSize:18,fontWeight:700,color:DARK,
          border:"2px solid " + (valid ? "#e0e0e0" : "#f5c6c6"),
          borderRadius:10,outline:"none",background:GRAY,transition:"border .15s",fontFamily:"inherit"}}
        onFocusCapture={function(e){e.target.style.borderColor=color;}}
        onBlurCapture={function(e){e.target.style.borderColor=valid?"#e0e0e0":"#f5c6c6";}}
      />
    </div>
  );
}

                      <div style={{fontSize:12,color:MUTED,marginBottom:5}}>จำนวนเงินค่าชดเชยรายวัน (บาท/วัน)</div>
                      <div style={{position:"relative"}}>
                        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",
                          fontSize:14,color:"#aaa",pointerEvents:"none"}}>฿</span>
                        <input type="text" inputMode="numeric"
                          value={rider.covStr} placeholder="1,000"
                          onChange={handleCovChange} onBlur={handleCovBlur} onFocus={handleCovFocus}
                          style={{width:"100%",padding:"10px 12px 10px 28px",fontSize:17,fontWeight:700,
                            color:DARK,border:"2px solid #e0e0e0",borderRadius:10,outline:"none",
                            background:GRAY,transition:"border .15s",fontFamily:"inherit"}}
                          onFocusCapture={function(e){e.target.style.borderColor=plan.color;}}
                          onBlurCapture={function(e){e.target.style.borderColor="#e0e0e0";}}
                        />
                      </div>
                      <div style={{fontSize:11,color:MUTED,marginTop:3}}>ขั้นต่ำ 100 บาท/วัน</div>
                    </div>

                    <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
                      {[500,1000,2000,3000].map(function(v) {
                        var active = rider.covVal === v;
                        return (
                          <button key={v} className="btn" onClick={function(){
                            updateRider(rider.id,"covVal",v);
                            updateRider(rider.id,"covStr",v.toLocaleString("th-TH"));
                          }} style={{
                            padding:"5px 10px",borderRadius:20,fontSize:11,
                            border:"1px solid "+(active?plan.color:"#e0e0e0"),
                            background:active?plan.color+"12":"#fff",
                            color:active?plan.color:"#777",fontWeight:active?700:400,
                          }}>{v.toLocaleString("th-TH")}</button>
                        );
                      })}
                    </div>

                    <div style={{padding:"6px 10px",background:plan.color+"0a",borderRadius:8,
                      fontSize:12,color:plan.color,marginBottom:8}}>
                      {plan.rateNote(age, rider.subIdx)}
                    </div>
                  </div>
                )}

                {/* CI */}
                {plan.id === "ci" && (
                  <div>
                    <div style={{marginBottom:8}}>
                      <div style={{fontSize:12,color:MUTED,marginBottom:5}}>ทุนประกัน / วงเงินคุ้มครองโรค (บาท)</div>
                      <div style={{position:"relative"}}>
                        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",
                          fontSize:14,color:"#aaa",pointerEvents:"none"}}>฿</span>
                        <input type="text" inputMode="numeric"
                          value={rider.covStr} placeholder="1,000,000"
                          onChange={handleCovChange} onBlur={handleCovBlur} onFocus={handleCovFocus}
                          style={{width:"100%",padding:"10px 12px 10px 28px",fontSize:17,fontWeight:700,
                            color:DARK,border:"2px solid #e0e0e0",borderRadius:10,outline:"none",
                            background:GRAY,transition:"border .15s",fontFamily:"inherit"}}
                          onFocusCapture={function(e){e.target.style.borderColor=plan.color;}}
                          onBlurCapture={function(e){e.target.style.borderColor="#e0e0e0";}}
                        />
                      </div>
                      {rider.covVal > 0 && rider.covVal < 100000 && (
                        <div style={{fontSize:11,color:"#e05050",marginTop:3}}>ทุนประกันขั้นต่ำ 100,000 บาท</div>
                      )}
                    </div>

                    <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
                      {[500000,1000000,2000000,5000000].map(function(v) {
                        var active = rider.covVal === v;
                        return (
                          <button key={v} className="btn" onClick={function(){
                            updateRider(rider.id,"covVal",v);
                            updateRider(rider.id,"covStr",v.toLocaleString("th-TH"));
                          }} style={{
                            padding:"5px 11px",borderRadius:20,fontSize:12,
                            border:"1px solid "+(active?plan.color:"#e0e0e0"),
                            background:active?plan.color+"12":"#fff",
                            color:active?plan.color:"#777",fontWeight:active?700:400,
                          }}>{v >= 1000000 ? (v/1000000)+"ล้าน" : (v/1000)+"K"}</button>
                        );
                      })}
                    </div>

                    <div style={{padding:"8px 10px",background:plan.color+"0a",borderRadius:8,
                      fontSize:12,color:plan.color,marginBottom:8}}>
                      {plan.rateNote(age, gender)}
                    </div>

                    <div style={{padding:"8px 10px",background:"#f8f8f8",borderRadius:8,fontSize:11,color:"#888"}}>
                      รวมเบี้ย AIA Multi-Pay CI + AIA Total Care · ต่ออายุได้ · อายุ 1–98 ปี
                    </div>
                  </div>
                )}

                {annual > 0 && (
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                    padding:"9px 12px",background:plan.color+"08",
                    borderRadius:10,border:"1px solid "+plan.color+"28"}}>
                    <span style={{fontSize:12,color:MUTED}}>เบี้ยรายปี</span>
                    <span style={{fontSize:18,fontWeight:700,color:plan.color}}>฿{fmt(annual)}</span>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>

    {/* TOTAL */}
    {grandTotal > 0 && (
      <div style={{background:"#fff",borderRadius:14,overflow:"hidden",
        boxShadow:"0 2px 12px rgba(232,23,93,0.15)"}}>
        <div style={{padding:"14px 16px",borderBottom:"1px solid #f5f5f5"}}>
          {mainAnnual > 0 && (
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:mainPlan ? mainPlan.color : PINK}}/>
                <span style={{fontSize:12,color:MUTED}}>{mainPlan ? mainPlan.name : ""}</span>
              </div>
              <span style={{fontSize:13,fontWeight:700}}>฿{fmt(mainAnnual)}</span>
            </div>
          )}
          {riderTotals.filter(function(r){return r.annual>0;}).map(function(r) {
            var rplan = findPlan(RIDER_PLANS, r.id);
            if(!rplan) return null;
            return (
              <div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:rplan.color}}/>
                  <span style={{fontSize:12,color:MUTED}}>{rplan.name}</span>
                </div>
                <span style={{fontSize:13,fontWeight:700}}>฿{fmt(r.annual)}</span>
              </div>
            );
          })}
          {grandTotal > 0 && (
            <div style={{height:5,borderRadius:3,background:"#f0f0f0",overflow:"hidden",display:"flex",marginTop:8}}>
              {(function(){
                var segs = [];
                if(mainAnnual > 0 && mainPlan) segs.push({val:mainAnnual,color:mainPlan.color});
                riderTotals.filter(function(r){return r.annual>0;}).forEach(function(r){
                  var rp = findPlan(RIDER_PLANS,r.id);
                  if(rp) segs.push({val:r.annual,color:rp.color});
                });
                return segs.map(function(seg,i){
                  return <div key={i} style={{width:(grandTotal>0?seg.val/grandTotal*100:0)+"%",background:seg.color,transition:"width .4s",minWidth:seg.val>0?2:0}}/>;
                });
              })()}
            </div>
          )}
        </div>
        <div style={{padding:"16px 18px",background:PINK,
          display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.75)",marginBottom:2}}>เบี้ยรวมปีแรก</div>
            {mainPlan && mainPlan.id === "20pay" && mainAnnual > 0 && (
              <div style={{fontSize:11,color:"rgba(255,255,255,.65)"}}>ชำระ 20 ปี · คุ้มครองถึงอายุ 99 ปี</div>
            )}
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:34,fontWeight:700,color:"#fff",lineHeight:1}}>฿{fmt(grandTotal)}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.65)",marginTop:2}}>บาท / ปี</div>
          </div>
        </div>
      </div>
    )}

    <div style={{marginTop:16,fontSize:11,color:"#bbb",textAlign:"center",lineHeight:1.6}}>
      ผลการคำนวณเป็นค่าประมาณการเบื้องต้นเท่านั้น
    </div>
  </div>

  {/* MAIN MODAL */}
  {showMainModal && (
    <div className="overlay" onClick={function(){setShowMainModal(false);}}>
      <div className="sheet" onClick={function(e){e.stopPropagation();}}>
        <div style={{padding:"16px 18px",borderBottom:"1px solid #f0f0f0",flexShrink:0,
          display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:15,fontWeight:700}}>แผนความคุ้มครองหลัก</span>
          <button className="btn" onClick={function(){setShowMainModal(false);}}
            style={{fontSize:14,color:PINK,fontWeight:600,background:"none",padding:"4px 8px"}}>ปิด</button>
        </div>
        <div className="sheet-body">
          <div className="plan-row" onClick={function(){setMainPlanId(null);setShowMainModal(false);}}>
            <div style={{width:36,height:36,borderRadius:10,background:"#f5f5f5",flexShrink:0,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>✕</div>
            <div style={{flex:1,fontSize:13,color:MUTED}}>ไม่เลือกแผนหลัก</div>
            {mainPlanId === null && <span style={{color:PINK,fontSize:18}}>✓</span>}
          </div>
          {MAIN_PLANS.map(function(p) {
            var active = mainPlanId === p.id;
            var cov = p.id==="20pay" ? cov20.val : p.id==="endow" ? covEndow.val : p.id==="cisc10" ? covCISC10.val : covCISC20.val;
            var ageOk  = age >= p.minAge && age <= p.maxAge;
            var prem   = ageOk && cov >= p.minCov ? p.calcAnnual(age, gender, cov) : null;
            return (
              <div key={p.id} className="plan-row"
                onClick={function(){setMainPlanId(p.id);setShowMainModal(false);}}>
                <div style={{width:36,height:36,borderRadius:10,flexShrink:0,
                  background:p.color+"15",border:"2px solid "+p.color+"40",
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <div style={{width:12,height:12,borderRadius:"50%",background:p.color}}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700,color:active?p.color:DARK}}>{p.name}</div>
                  <div style={{display:"flex",gap:4,marginTop:3,flexWrap:"wrap"}}>
                    {p.tags.map(function(t){return <span key={t} className="tag">{t}</span>;})}
                  </div>
                  {!ageOk && <div style={{fontSize:11,color:"#e05050",marginTop:3}}>รับประกันอายุ {p.minAge}–{p.maxAge} ปี</div>}
                </div>
                {prem !== null && (
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:10,color:MUTED}}>เบี้ยฯ</div>
                    <div style={{fontSize:15,fontWeight:700,color:p.color}}>฿{fmt(prem)}</div>
                  </div>
                )}
                {active && <span style={{color:PINK,fontSize:18,marginLeft:8,flexShrink:0}}>✓</span>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  )}

  {/* RIDER MODAL */}
  {showRiderModal && (
    <div className="overlay" onClick={function(){setShowRiderModal(false);}}>
      <div className="sheet" onClick={function(e){e.stopPropagation();}}>
        <div style={{padding:"16px 18px",borderBottom:"1px solid #f0f0f0",flexShrink:0,
          display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:15,fontWeight:700}}>เพิ่ม/ลดสัญญาเพิ่มเติม</span>
          <button className="btn" onClick={function(){setShowRiderModal(false);}}
            style={{fontSize:14,color:PINK,fontWeight:600,background:"none",padding:"4px 8px"}}>เสร็จ</button>
        </div>
        <div style={{padding:"10px 16px",background:"#fafafa",flexShrink:0,
          fontSize:12,color:MUTED,borderBottom:"1px solid #f0f0f0"}}>
          เลือกได้หลายรายการ · กดเพื่อเปิด/ปิด
        </div>
        <div className="sheet-body">
          {RIDER_PLANS.map(function(p) {
            var active    = false;
            var curRider  = null;
            for(var i=0;i<activeRiders.length;i++){if(activeRiders[i].id===p.id){active=true;curRider=activeRiders[i];break;}}
            var ageOk     = age >= p.minAge && age <= p.maxAge;
            var prem      = curRider && ageOk ? p.calcAnnual(age, gender, curRider.covVal || 0, curRider.subIdx || 0) : null;
            return (
              <div key={p.id} className="plan-row" onClick={function(){toggleRider(p.id);}}>
                <div style={{width:24,height:24,borderRadius:6,flexShrink:0,
                  border:"2px solid "+(active?p.color:"#ccc"),
                  background:active?p.color:"#fff",
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {active && <span style={{color:"#fff",fontSize:14,fontWeight:700,lineHeight:1}}>✓</span>}
                </div>
                <div style={{width:36,height:36,borderRadius:10,flexShrink:0,
                  background:p.color+"15",border:"2px solid "+p.color+"40",
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <div style={{width:12,height:12,borderRadius:"50%",background:p.color}}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700,color:active?p.color:DARK}}>{p.name}</div>
                  <div style={{display:"flex",gap:4,marginTop:3,flexWrap:"wrap"}}>
                    {p.tags.map(function(t){return <span key={t} className="tag">{t}</span>;})}
                  </div>
                  {!ageOk && <div style={{fontSize:11,color:"#e05050",marginTop:3}}>รับประกันอายุ {p.minAge}–{p.maxAge} ปี</div>}
                </div>
                {prem !== null && prem > 0 && (
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:10,color:MUTED}}>เบี้ยฯ</div>
                    <div style={{fontSize:15,fontWeight:700,color:p.color}}>฿{fmt(prem)}</div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  )}
</div>

  </script>
