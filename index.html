<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>uLife AIA</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#E8175D"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="uLife AIA"/>
  <link rel="apple-touch-icon" href="/icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#f0f2f5;font-family:'Sarabun','Noto Sans Thai',sans-serif}
    #root{min-height:100vh}
    input{font-family:inherit}
    .btn{cursor:pointer;border:none;font-family:inherit;transition:all .15s}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end}
    .sheet{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
    .sheet-body{overflow-y:auto;flex:1}
    .plan-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer;gap:12px;transition:background .12s}
    .plan-row:active{background:#fafafa}
    .plan-row:last-child{border-bottom:none}
    .tag{font-size:10px;padding:2px 7px;border-radius:10px;background:#f0f0f0;color:#888}
    .rider-card{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
