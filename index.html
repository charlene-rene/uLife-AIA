function get20PayRate(age, gender) {
  var key = Math.min(Math.max(age, 1), 70);
  var row = aia20PayRates[key];

  if(age<=35) return 82; if(age<=40) return 83; if(age<=45) return 84;
  if(age<=50) return 86; if(age<=55) return 88; if(age<=65) return 90;
  if(age===66) return 91; if(age===67) return 93; if(age===68) return 94;

function getHHGroup(age) {
  if(age<=15) return "11-15"; if(age<=20) return "16-20"; if(age<=25) return "21-25";
  if(age<=30) return "26-30"; if(age<=35) return "31-35"; if(age<=40) return "36-40";

  if(age<=75) return "71-75"; if(age<=80) return "76-80"; if(age<=85) return "81-85";
  if(age<=90) return "86-90"; if(age<=95) return "91-95"; return "96-98";
}

function getHHAnnual(age, gender, subIdx) {
  var grp = getHHGroup(age);
  var row = hhRates[grp];
  if(!row) return 0;
  var arr = row[gender];
  if(!arr) return 0;
  return arr[subIdx] || 0;
}

function getHBRate(age, occIdx) {
  if(age < 6 || age > 59) return 0;
  if(age <= 15) return 90;
  return [150, 187, 225][occIdx] || 150;
}

function getCIAnnual(age, gender, cov) {
  var grp = getCIGroup(age);
  var row = ciRates[grp];
  if(!row) return 0;
  return ((row[gender] || 0) * cov) / 1000;

const MAIN_PLANS = [

function fmt(n) { return Math.round(n).toLocaleString("th-TH"); }

function findPlan(arr, id) {
  for(var i=0;i<arr.length;i++) { if(arr[i].id===id) return arr[i]; }
  return null;
}

function useCovInput(initial) {
  var def = initial || 1000000;
  var [str, setStr] = useState(def.toLocaleString("th-TH"));
  var [val, setVal] = useState(def);
  var ref = useRef(null);
  useEffect(function() {
    var n = parseInt(str.replace(/,/g,""), 10);
    setVal(!isNaN(n) && n > 0 ? n : 0);
  }, [str]);
  function onChange(e) { setStr(e.target.value.replace(/[^0-9]/g,"")); }
  function onBlur() { var n=parseInt(str.replace(/,/g,""),10); if(!isNaN(n)) setStr(n.toLocaleString("th-TH")); }
  function onFocus() { setStr(String(val)); setTimeout(function(){if(ref.current)ref.current.select();},30); }
  function setQuick(v) { setStr(v.toLocaleString("th-TH")); }
  return {str,val,ref,onChange,onBlur,onFocus,setQuick};
}

function MoneyInput(props) {
  var hook=props.hook, color=props.color, valid=props.valid!==false, ph=props.placeholder||"0";
  return (
    <div style={{position:"relative"}}>
      <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#aaa",pointerEvents:"none"}}>฿</span>
      <input ref={hook.ref} type="text" inputMode="numeric" value={hook.str}
        onChange={hook.onChange} onBlur={hook.onBlur} onFocus={hook.onFocus} placeholder={ph}
        style={{width:"100%",padding:"11px 12px 11px 28px",fontSize:18,fontWeight:700,color:DARK,
          border:"2px solid "+(valid?"#e0e0e0":"#f5c6c6"),borderRadius:10,outline:"none",
          background:GRAY,transition:"border .15s",fontFamily:"inherit"}}
        onFocusCapture={function(e){e.target.style.borderColor=color;}}
        onBlurCapture={function(e){e.target.style.borderColor=valid?"#e0e0e0":"#f5c6c6";}}
      />
    </div>
  );
}

  var [gender,setGender] = useState("m");

  function toggleRider(planId) {
    setActiveRiders(function(prev) {
      for(var i=0;i<prev.length;i++) { if(prev[i].id===planId) return prev.filter(function(r){return r.id!==planId;}); }
      var plan=findPlan(RIDER_PLANS,planId);
      var defCov=plan&&plan.covDefault?plan.covDefault:1000;
      return prev.concat([{id:planId,subIdx:0,covVal:defCov,covStr:defCov.toLocaleString("th-TH")}]);
    });
  }

  function updateRider(rid,field,value) {
    setActiveRiders(function(prev){
      return prev.map(function(r){
        if(r.id!==rid) return r;
        var u={}; for(var k in r) u[k]=r[k]; u[field]=value; return u;
      });
    });
  }

  function calcRiderAnnual(rider) {
    var plan=findPlan(RIDER_PLANS,rider.id);
    if(!plan||age<plan.minAge||age>plan.maxAge) return 0;
    if(plan.hasCovInput&&rider.covVal<(plan.minCov||0)) return 0;
    return plan.calcAnnual(age,gender,rider.covVal||0,rider.subIdx||0);
  }

  var mainPlan=findPlan(MAIN_PLANS,mainPlanId);

  var covInput=mainPlanId==="20pay"?cov20:covEndow;
  var mainAnnual=0;

  var riderSum=riderTotals.reduce(function(s,r){return s+r.annual;},0);
  var grandTotal=mainAnnual+riderSum;

        .plan-row:active{background:#fafafa}
        .plan-row:last-child{border-bottom:none}
        .tag{font-size:10px;padding:2px 7px;border-radius:10px;background:#f0f0f0;color:#888}
        .rider-card{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden}
      `}</style>

      <div style={{background:"#fff",borderBottom:"1px solid #e8e8e8",padding:"14px 16px",display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:34,height:34,background:PINK,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:16,flexShrink:0}}>u</div>
        <div>
          <div style={{fontSize:15,fontWeight:700}}>uLife AIA</div>

        </div>
      </div>

          </div>
          {mainPlan ? (
            <div style={{padding:"14px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <div style={{width:36,height:36,borderRadius:10,flexShrink:0,background:mainPlan.color+"18",border:"2px solid "+mainPlan.color+"40",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <div style={{width:12,height:12,borderRadius:"50%",background:mainPlan.color}}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700}}>{mainPlan.name}</div>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:4}}>{mainPlan.tags.map(function(t){return <span key={t} className="tag">{t}</span>;})}</div>
                </div>
              </div>
              {(age<mainPlan.minAge||age>mainPlan.maxAge)&&<div style={{padding:"8px 12px",background:"#fff3f3",borderRadius:8,fontSize:12,color:"#e05050",marginBottom:12}}>⚠️ รับประกันอายุ {mainPlan.minAge}–{mainPlan.maxAge} ปี</div>}
              <div style={{marginBottom:8}}>
                <div style={{fontSize:12,color:MUTED,marginBottom:6}}>ทุนประกัน (บาท)</div>
                <MoneyInput hook={covInput} color={mainPlan.color} valid={mainCov>=mainPlan.minCov} placeholder="100,000"/>
                {mainCov>0&&mainCov<mainPlan.minCov&&<div style={{fontSize:11,color:"#e05050",marginTop:3}}>ทุนประกันขั้นต่ำ {mainPlan.minCov.toLocaleString("th-TH")} บาท</div>}
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                {[500000,1000000,2000000,5000000].map(function(v){
                  return <button key={v} className="btn" onClick={function(){covInput.setQuick(v);}} style={{padding:"5px 11px",borderRadius:20,fontSize:12,border:"1px solid "+(mainCov===v?mainPlan.color:"#e0e0e0"),background:mainCov===v?mainPlan.color+"12":"#fff",color:mainCov===v?mainPlan.color:"#777",fontWeight:mainCov===v?700:400}}>{v>=1000000?(v/1000000)+"ล้าน":(v/1000)+"K"}</button>;
                })}
              </div>
              {mainPlan.rateNote&&age>=mainPlan.minAge&&age<=mainPlan.maxAge&&<div style={{fontSize:12,color:"#888",marginBottom:6}}>{mainPlan.rateNote(age)}</div>}
              {mainPlan.discNote&&mainPlan.discNote(mainCov)&&<div style={{padding:"6px 10px",background:"rgba(78,205,196,0.08)",borderRadius:8,fontSize:12,color:"#3aaca6",marginBottom:8}}>✓ {mainPlan.discNote(mainCov)}</div>}
              {mainAnnual>0&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:mainPlan.color+"08",borderRadius:10,border:"1px solid "+mainPlan.color+"28"}}><span style={{fontSize:13,color:MUTED}}>เบี้ยหลักรายปี</span><span style={{fontSize:20,fontWeight:700,color:mainPlan.color}}>฿{fmt(mainAnnual)}</span></div>}
            </div>
          ) : (
            <div style={{padding:"20px 16px",textAlign:"center"}}><button className="btn" onClick={function(){setShowMainModal(true);}} style={{padding:"10px 20px",borderRadius:10,background:PINK+"10",border:"1px dashed "+PINK+"60",color:PINK,fontSize:13,fontWeight:600}}>+ เลือกแผนความคุ้มครองหลัก</button></div>
          )}
        </div>

        <div style={{marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <span style={{fontSize:13,fontWeight:700}}>กลุ่มสัญญาเพิ่มเติม</span>
            <button className="btn" onClick={function(){setShowRiderModal(true);}} style={{fontSize:12,color:PINK,fontWeight:600,background:"none",padding:"4px 8px",borderRadius:6,border:"1px solid rgba(232,23,93,0.25)"}}>+ เพิ่ม/ลดสัญญา</button>
          </div>
          {activeRiders.length===0&&<div style={{background:"#fff",borderRadius:14,padding:"18px 16px",textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}><button className="btn" onClick={function(){setShowRiderModal(true);}} style={{padding:"10px 20px",borderRadius:10,background:"#f8f8f8",border:"1px dashed #ccc",color:"#aaa",fontSize:13}}>ยังไม่มีสัญญาเพิ่มเติม</button></div>}
          {activeRiders.map(function(rider){
            var plan=findPlan(RIDER_PLANS,rider.id);
            if(!plan) return null;
            var annual=calcRiderAnnual(rider), ageOk=age>=plan.minAge&&age<=plan.maxAge;
            function hCC(e){var raw=e.target.value.replace(/[^0-9]/g,""),n=parseInt(raw,10);setActiveRiders(function(prev){return prev.map(function(r){if(r.id!==rider.id)return r;return {id:r.id,subIdx:r.subIdx,covVal:(!isNaN(n)&&n>0?n:0),covStr:raw};});});}
            function hCB(){setActiveRiders(function(prev){return prev.map(function(r){if(r.id!==rider.id)return r;return {id:r.id,subIdx:r.subIdx,covVal:r.covVal,covStr:r.covVal.toLocaleString("th-TH")};});});}
            function hCF(e){setActiveRiders(function(prev){return prev.map(function(r){if(r.id!==rider.id)return r;return {id:r.id,subIdx:r.subIdx,covVal:r.covVal,covStr:String(r.covVal||"")};});});setTimeout(function(){if(e.target)e.target.select();},30);}
            return (
              <div key={rider.id} className="rider-card">
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",borderBottom:ageOk?"1px solid #f5f5f5":"none",background:plan.color+"06"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:30,height:30,borderRadius:8,flexShrink:0,background:plan.color+"18",border:"2px solid "+plan.color+"40",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:10,height:10,borderRadius:"50%",background:plan.color}}/></div>
                    <div><div style={{fontSize:12,fontWeight:700,color:plan.color}}>{plan.name}</div><div style={{display:"flex",gap:3,flexWrap:"wrap",marginTop:2}}>{plan.tags.map(function(t){return <span key={t} className="tag">{t}</span>;})}</div></div>
                  </div>
                  <button className="btn" onClick={function(){toggleRider(rider.id);}} style={{width:28,height:28,borderRadius:"50%",background:"#f0f0f0",color:"#aaa",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>✕</button>
                </div>
                {!ageOk&&<div style={{padding:"8px 14px",background:"#fff3f3",fontSize:12,color:"#e05050"}}>⚠️ รับประกันอายุ {plan.minAge}–{plan.maxAge} ปี</div>}
                {ageOk&&(
                  <div style={{padding:"12px 14px"}}>
                    {plan.id==="hh"&&(
                      <div>
                        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5,marginBottom:8}}>
                          {plan.subOptions.map(function(opt,i){var a=rider.subIdx===i;return <button key={i} className="btn" onClick={function(){updateRider(rider.id,"subIdx",i);}} style={{padding:"8px 4px",borderRadius:9,textAlign:"center",border:"2px solid "+(a?plan.color:"#e8e8e8"),background:a?plan.color+"0e":"#fff"}}><div style={{fontSize:11,fontWeight:700,color:a?plan.color:"#555"}}>{opt.label}</div><div style={{fontSize:9,color:MUTED,marginTop:1}}>ล้าน</div></button>;})}
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,marginBottom:10}}>
                          {plan.subOptions.map(function(_,i){var v=getHHAnnual(age,gender,i),a=rider.subIdx===i;return <div key={i} onClick={function(){updateRider(rider.id,"subIdx",i);}} style={{padding:"4px",borderRadius:7,textAlign:"center",cursor:"pointer",background:a?plan.color+"0a":"#f8f8f8",border:"1px solid "+(a?plan.color+"40":"#eee")}}><div style={{fontSize:8,color:MUTED}}>แผน {i+1}</div><div style={{fontSize:11,fontWeight:700,color:a?plan.color:"#666"}}>฿{fmt(v)}</div></div>;})}
                        </div>
                      </div>
                    )}
                    {plan.id==="hb"&&(
                      <div>
                        {age>=16?(
                          <div>
                            <div style={{fontSize:12,color:MUTED,marginBottom:5}}>ขั้นอาชีพ</div>
                            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5,marginBottom:10}}>
                              {HB_OCC.map(function(opt,i){var a=rider.subIdx===i;return <button key={i} className="btn" onClick={function(){updateRider(rider.id,"subIdx",i);}} style={{padding:"8px 5px",borderRadius:9,textAlign:"center",border:"2px solid "+(a?plan.color:"#e8e8e8"),background:a?plan.color+"0e":"#fff"}}><div style={{fontSize:11,fontWeight:700,color:a?plan.color:"#555"}}>{opt.label}</div><div style={{fontSize:9,color:MUTED,marginTop:1}}>{opt.sub}</div></button>;})}
                            </div>
                          </div>
                        ):<div style={{padding:"6px 10px",background:plan.color+"0a",borderRadius:8,fontSize:12,color:plan.color,marginBottom:8}}>อายุ 6–15 ปี: อัตราเบี้ย 90 บาท / เงินเอาประกัน 100 บาท</div>}
                        <div style={{marginBottom:8}}>
                          <div style={{fontSize:12,color:MUTED,marginBottom:5}}>จำนวนเงินค่าชดเชยรายวัน (บาท/วัน)</div>
                          <div style={{position:"relative"}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#aaa",pointerEvents:"none"}}>฿</span><input type="text" inputMode="numeric" value={rider.covStr} placeholder="1,000" onChange={hCC} onBlur={hCB} onFocus={hCF} style={{width:"100%",padding:"10px 12px 10px 28px",fontSize:17,fontWeight:700,color:DARK,border:"2px solid #e0e0e0",borderRadius:10,outline:"none",background:GRAY,fontFamily:"inherit"}} onFocusCapture={function(e){e.target.style.borderColor=plan.color;}} onBlurCapture={function(e){e.target.style.borderColor="#e0e0e0";}}/></div>
                          <div style={{fontSize:11,color:MUTED,marginTop:3}}>ขั้นต่ำ 100 บาท/วัน</div>
                        </div>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
                          {[500,1000,2000,3000].map(function(v){var a=rider.covVal===v;return <button key={v} className="btn" onClick={function(){updateRider(rider.id,"covVal",v);updateRider(rider.id,"covStr",v.toLocaleString("th-TH"));}} style={{padding:"5px 10px",borderRadius:20,fontSize:11,border:"1px solid "+(a?plan.color:"#e0e0e0"),background:a?plan.color+"12":"#fff",color:a?plan.color:"#777",fontWeight:a?700:400}}>{v.toLocaleString("th-TH")}</button>;})}
                        </div>
                        <div style={{padding:"6px 10px",background:plan.color+"0a",borderRadius:8,fontSize:12,color:plan.color,marginBottom:8}}>{plan.rateNote(age,rider.subIdx)}</div>
                      </div>
                    )}
                    {plan.id==="ci"&&(
                      <div>
                        <div style={{marginBottom:8}}>
                          <div style={{fontSize:12,color:MUTED,marginBottom:5}}>ทุนประกัน / วงเงินคุ้มครองโรค (บาท)</div>
                          <div style={{position:"relative"}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#aaa",pointerEvents:"none"}}>฿</span><input type="text" inputMode="numeric" value={rider.covStr} placeholder="1,000,000" onChange={hCC} onBlur={hCB} onFocus={hCF} style={{width:"100%",padding:"10px 12px 10px 28px",fontSize:17,fontWeight:700,color:DARK,border:"2px solid #e0e0e0",borderRadius:10,outline:"none",background:GRAY,fontFamily:"inherit"}} onFocusCapture={function(e){e.target.style.borderColor=plan.color;}} onBlurCapture={function(e){e.target.style.borderColor="#e0e0e0";}}/></div>
                          {rider.covVal>0&&rider.covVal<100000&&<div style={{fontSize:11,color:"#e05050",marginTop:3}}>ทุนประกันขั้นต่ำ 100,000 บาท</div>}
                        </div>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
                          {[500000,1000000,2000000,5000000].map(function(v){var a=rider.covVal===v;return <button key={v} className="btn" onClick={function(){updateRider(rider.id,"covVal",v);updateRider(rider.id,"covStr",v.toLocaleString("th-TH"));}} style={{padding:"5px 11px",borderRadius:20,fontSize:12,border:"1px solid "+(a?plan.color:"#e0e0e0"),background:a?plan.color+"12":"#fff",color:a?plan.color:"#777",fontWeight:a?700:400}}>{v>=1000000?(v/1000000)+"ล้าน":(v/1000)+"K"}</button>;})}
                        </div>
                        <div style={{padding:"8px 10px",background:plan.color+"0a",borderRadius:8,fontSize:12,color:plan.color,marginBottom:8}}>{plan.rateNote(age,gender)}</div>
                        <div style={{padding:"8px 10px",background:"#f8f8f8",borderRadius:8,fontSize:11,color:"#888"}}>รวมเบี้ย AIA Multi-Pay CI + AIA Total Care · อายุ 1–98 ปี</div>
                      </div>
                    )}
                    {annual>0&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",background:plan.color+"08",borderRadius:10,border:"1px solid "+plan.color+"28",marginTop:8}}><span style={{fontSize:12,color:MUTED}}>เบี้ยรายปี</span><span style={{fontSize:18,fontWeight:700,color:plan.color}}>฿{fmt(annual)}</span></div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {grandTotal>0&&(
          <div style={{background:"#fff",borderRadius:14,overflow:"hidden",boxShadow:"0 2px 12px rgba(232,23,93,0.15)"}}>
            <div style={{padding:"14px 16px",borderBottom:"1px solid #f5f5f5"}}>
              {mainAnnual>0&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:8,height:8,borderRadius:"50%",background:mainPlan?mainPlan.color:PINK}}/><span style={{fontSize:12,color:MUTED}}>{mainPlan?mainPlan.name:""}</span></div><span style={{fontSize:13,fontWeight:700}}>฿{fmt(mainAnnual)}</span></div>}
              {riderTotals.filter(function(r){return r.annual>0;}).map(function(r){var rp=findPlan(RIDER_PLANS,r.id);if(!rp)return null;return <div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:8,height:8,borderRadius:"50%",background:rp.color}}/><span style={{fontSize:12,color:MUTED}}>{rp.name}</span></div><span style={{fontSize:13,fontWeight:700}}>฿{fmt(r.annual)}</span></div>;})}
              {grandTotal>0&&<div style={{height:5,borderRadius:3,background:"#f0f0f0",overflow:"hidden",display:"flex",marginTop:8}}>{(function(){var segs=[];if(mainAnnual>0&&mainPlan)segs.push({val:mainAnnual,color:mainPlan.color});riderTotals.filter(function(r){return r.annual>0;}).forEach(function(r){var rp=findPlan(RIDER_PLANS,r.id);if(rp)segs.push({val:r.annual,color:rp.color});});return segs.map(function(seg,i){return <div key={i} style={{width:(grandTotal>0?seg.val/grandTotal*100:0)+"%",background:seg.color,minWidth:seg.val>0?2:0}}/>;});})()}</div>}
            </div>
            <div style={{padding:"16px 18px",background:PINK,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div style={{fontSize:12,color:"rgba(255,255,255,.75)",marginBottom:2}}>เบี้ยรวมปีแรก</div>
                {mainPlan&&mainPlan.id==="20pay"&&mainAnnual>0&&<div style={{fontSize:11,color:"rgba(255,255,255,.65)"}}>ชำระ 20 ปี · คุ้มครองถึงอายุ 99 ปี</div>}
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:34,fontWeight:700,color:"#fff",lineHeight:1}}>฿{fmt(grandTotal)}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,.65)",marginTop:2}}>บาท / ปี</div>
              </div>
            </div>
          </div>
        )}
        <div style={{marginTop:16,fontSize:11,color:"#bbb",textAlign:"center",lineHeight:1.6}}>ผลการคำนวณเป็นค่าประมาณการเบื้องต้นเท่านั้น</div>
      </div>

      {showMainModal&&(
        <div className="overlay" onClick={function(){setShowMainModal(false);}}>
          <div className="sheet" onClick={function(e){e.stopPropagation();}}>
            <div style={{padding:"16px 18px",borderBottom:"1px solid #f0f0f0",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontSize:15,fontWeight:700}}>แผนความคุ้มครองหลัก</span><button className="btn" onClick={function(){setShowMainModal(false);}} style={{fontSize:14,color:PINK,fontWeight:600,background:"none",padding:"4px 8px"}}>ปิด</button></div>
            <div className="sheet-body">
              <div className="plan-row" onClick={function(){setMainPlanId(null);setShowMainModal(false);}}><div style={{width:36,height:36,borderRadius:10,background:"#f5f5f5",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>✕</div><div style={{flex:1,fontSize:13,color:MUTED}}>ไม่เลือกแผนหลัก</div>{mainPlanId===null&&<span style={{color:PINK,fontSize:18}}>✓</span>}</div>
              {MAIN_PLANS.map(function(p){var active=mainPlanId===p.id,cov=p.id==="20pay"?cov20.val:covEndow.val,ageOk=age>=p.minAge&&age<=p.maxAge,prem=ageOk&&cov>=p.minCov?p.calcAnnual(age,gender,cov):null;return(
                <div key={p.id} className="plan-row" onClick={function(){setMainPlanId(p.id);setShowMainModal(false);}}>
                  <div style={{width:36,height:36,borderRadius:10,flexShrink:0,background:p.color+"15",border:"2px solid "+p.color+"40",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:12,height:12,borderRadius:"50%",background:p.color}}/></div>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:active?p.color:DARK}}>{p.name}</div><div style={{display:"flex",gap:4,marginTop:3,flexWrap:"wrap"}}>{p.tags.map(function(t){return <span key={t} className="tag">{t}</span>;})}</div>{!ageOk&&<div style={{fontSize:11,color:"#e05050",marginTop:3}}>รับประกันอายุ {p.minAge}–{p.maxAge} ปี</div>}</div>
                  {prem!==null&&<div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:10,color:MUTED}}>เบี้ยฯ</div><div style={{fontSize:15,fontWeight:700,color:p.color}}>฿{fmt(prem)}</div></div>}
                  {active&&<span style={{color:PINK,fontSize:18,marginLeft:8,flexShrink:0}}>✓</span>}
                </div>
              );})}
            </div>
          </div>
        </div>
      )}

      {showRiderModal&&(
        <div className="overlay" onClick={function(){setShowRiderModal(false);}}>
          <div className="sheet" onClick={function(e){e.stopPropagation();}}>
            <div style={{padding:"16px 18px",borderBottom:"1px solid #f0f0f0",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontSize:15,fontWeight:700}}>เพิ่ม/ลดสัญญาเพิ่มเติม</span><button className="btn" onClick={function(){setShowRiderModal(false);}} style={{fontSize:14,color:PINK,fontWeight:600,background:"none",padding:"4px 8px"}}>เสร็จ</button></div>
            <div style={{padding:"10px 16px",background:"#fafafa",flexShrink:0,fontSize:12,color:MUTED,borderBottom:"1px solid #f0f0f0"}}>เลือกได้หลายรายการ · กดเพื่อเปิด/ปิด</div>
            <div className="sheet-body">
              {RIDER_PLANS.map(function(p){
                var active=false,curRider=null;
                for(var i=0;i<activeRiders.length;i++){if(activeRiders[i].id===p.id){active=true;curRider=activeRiders[i];break;}}
                var ageOk=age>=p.minAge&&age<=p.maxAge;
                var prem=curRider&&ageOk?p.calcAnnual(age,gender,curRider.covVal||0,curRider.subIdx||0):null;
                return(
                  <div key={p.id} className="plan-row" onClick={function(){toggleRider(p.id);}}>
                    <div style={{width:24,height:24,borderRadius:6,flexShrink:0,border:"2px solid "+(active?p.color:"#ccc"),background:active?p.color:"#fff",display:"flex",alignItems:"center",justifyContent:"center"}}>{active&&<span style={{color:"#fff",fontSize:14,fontWeight:700,lineHeight:1}}>✓</span>}</div>
                    <div style={{width:36,height:36,borderRadius:10,flexShrink:0,background:p.color+"15",border:"2px solid "+p.color+"40",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:12,height:12,borderRadius:"50%",background:p.color}}/></div>
                    <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:active?p.color:DARK}}>{p.name}</div><div style={{display:"flex",gap:4,marginTop:3,flexWrap:"wrap"}}>{p.tags.map(function(t){return <span key={t} className="tag">{t}</span>;})}</div>{!ageOk&&<div style={{fontSize:11,color:"#e05050",marginTop:3}}>รับประกันอายุ {p.minAge}–{p.maxAge} ปี</div>}</div>
                    {prem!==null&&prem>0&&<div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:10,color:MUTED}}>เบี้ยฯ</div><div style={{fontSize:15,fontWeight:700,color:p.color}}>฿{fmt(prem)}</div></div>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
